apiVersion: apps/v1
kind: Deployment
metadata:
  name: aerosec-ai-engine
  labels:
    app: aerosec-ai-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aerosec-ai-engine
  template:
    metadata:
      labels:
        app: aerosec-ai-engine
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: aerosec-ai-engine
          image: dhouiouialaaa/aerosec-tower:ai-engine-IMAGE_TAG_PLACEHOLDER
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: aerosec-ai-engine
spec:
  selector:
    app: aerosec-ai-engine
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
